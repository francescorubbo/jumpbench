# Keep ruff/ty revisions in sync with pyproject.toml [project.optional-dependencies] dev.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.79
    hooks:
      - id: ty
        args: [--isolated, --extra=dev, --extra=images]
