[project]
name = "jumpbench"
version = "0.1.0"
description = "Reproduce JUMP-lite CellProfiler vs embedding benchmarks with explicit control over embedding generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "embeddings_benchmark" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=1.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "copairs>=0.5.1",
    "boto3>=1.34",
    "tqdm>=4.66",
    "tifffile>=2024.2",
    "imagecodecs>=2024.1",
]

[project.optional-dependencies]
images = [
    "zarr>=2.18",
    "numcodecs>=0.13",
]
embed = [
    "torch>=2.2",
    "transformers>=4.40",
    "timm>=1.0",
    "huggingface-hub>=0.23",
]
cellprofiler = [
    "cp-measure @ git+https://github.com/afermg/cp_measure.git",
]
dev = [
    "pre-commit>=4.3",
    "pytest>=8.0",
    "ruff==0.16.5",
    "ty==0.0.79",
]

[project.scripts]
jumpbench = "jumpbench.cli:main"

[project.urls]
Paper = "https://arxiv.org/abs/2608.07632"
Upstream = "https://github.com/afermg/JUMP_lite"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # formatter already wraps code; E501 only flags long strings/signatures

[tool.ty.environment]
python-version = "3.11"

[tool.ty.analysis]
# Torch / transformers live in the optional `embed` extra, not the default env.
allowed-unresolved-imports = ["torch", "torch.**", "transformers", "transformers.**", "timm", "timm.**"]
